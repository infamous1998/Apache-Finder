<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body><title>Apache Coy Platoon Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column, a kiosk-style lookup card that turns into a full-colour platoon card */
:root {
  --bg: #eef0ec; --surface: #ffffff; --ink: #1d231c; --muted: #5d665b; --line: #cfd5cb;
  --olive: #3f4f2e; --olive-ink: #f3f5ee; --danger: #a3261b;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  /* platoon colours — same as the nominal roll */
  --p1: #FFFF66; --p2: #FF5050; --p3: #CCFFCC; --p4: #00CCFF;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a14; --surface: #1f251d; --ink: #e9ede5; --muted: #a2ab9e; --line: #343d31;
  --olive: #8fa36c; --olive-ink: #12160f; --danger: #ff8a7a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151a14; --surface: #1f251d; --ink: #e9ede5; --muted: #a2ab9e; --line: #343d31;
  --olive: #8fa36c; --olive-ink: #12160f; --danger: #ff8a7a; color-scheme: dark }

[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 40px; }
.wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

header { display: flex; flex-direction: column; gap: 2px; }
.eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font: 800 40px/1 var(--display); letter-spacing: .01em; text-transform: uppercase; margin: 6px 0 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
label { font: 600 13px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
input { font: 600 26px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; width: 100%; box-sizing: border-box;
  padding: 14px 14px; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
input:focus { outline: none; border-color: var(--olive); }
button { font: 700 20px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
  padding: 16px; border: 0; border-radius: 8px; background: var(--olive); color: var(--olive-ink); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
button[disabled] { opacity: .6; cursor: wait; }
.hint { font-size: 14px; color: var(--muted); margin: 0; }
.err { color: var(--danger); font-weight: 600; margin: 0; }

/* result */
.result { border-radius: 12px; overflow: hidden; color: #141414; border: 1px solid rgba(0,0,0,.15); }
.band { padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 4px; }
.band .eyebrow { color: rgba(0,0,0,.62); }
.plt { font: 800 54px/0.95 var(--display); text-transform: uppercase; margin: 2px 0 0; }
.name { font: 600 19px/1.3 var(--body); margin: 6px 0 0; }
.d4 { display: flex; gap: 0; margin-top: 14px; align-self: flex-start; background: #141414; color: #fff; border-radius: 6px; overflow: hidden; }
.d4 span { font: 600 30px/1 var(--mono); padding: 10px 10px; }
.d4 span + span { border-left: 1px solid rgba(255,255,255,.25); }
.d4legend { display: flex; gap: 14px; font: 500 12px/1 var(--mono); color: rgba(0,0,0,.62); margin-top: 6px; flex-wrap: wrap; }
.facts { background: var(--surface); color: var(--ink); padding: 18px 20px; display: grid; gap: 12px; }
.row { display: grid; grid-template-columns: 128px 1fr; gap: 12px; align-items: baseline; }
.row dt { font: 600 12px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.row dd { margin: 0; font-weight: 600; min-width: 0; }
.next { background: var(--surface); color: var(--ink); border-top: 1px dashed var(--line); padding: 16px 20px 20px; }
.next strong { display: block; font: 700 18px/1.2 var(--display); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.wa { display: block; margin: 0; padding: 16px 20px; background: #1f8f4e; color: #fff; text-decoration: none; text-align: center; font: 700 20px/1.2 var(--display); letter-spacing: .05em; text-transform: uppercase; }
.wa:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.wa-none { margin: 0; padding: 12px 20px; background: var(--surface); color: var(--muted); font-size: 14px; border-top: 1px dashed var(--line); }
.again { background: transparent; color: var(--ink); border: 2px solid var(--line); font-size: 17px; }
.demo { font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.demo summary { cursor: pointer; font-weight: 600; }
.demo code { font-family: var(--mono); color: var(--ink); }
.demo ul { margin: 8px 0 0; padding-left: 18px; columns: 2; }
@media (max-width: 380px) { .row { grid-template-columns: 1fr; gap: 2px; } .plt { font-size: 46px; } }
@media (prefers-reduced-motion: no-preference) { .result { animation: rise .35s ease-out both; } @keyframes rise { from { transform: translateY(8px); } to { transform: none; } } }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">0127 BP · Enlistment 22 Oct 2026</span>
    <h1>Apache Coy<br>Platoon Finder</h1>
    <p class="sub">Enter your NRIC to see your platoon, 4D number and commanders.</p>
  </header>

  <form id="f" class="card" autocomplete="off" novalidate>
    <label for="nric">NRIC</label>
    <input id="nric" inputmode="text" maxlength="9" placeholder="T1234567A" spellcheck="false" autocapitalize="characters">
    <p id="err" class="err" hidden></p>
    <button id="go" type="submit">Find my platoon</button>
    <p class="hint">Your NRIC is checked on this phone only. It is not sent or saved anywhere.</p>
  </form>

  <section id="res" hidden aria-live="polite"></section>
</div>

/* Platoon details: placeholders until the real commanders are confirmed */
const PLATOONS = {
  1: { colour: 'var(--p1)', colourName: 'Yellow', pc: 'Encik Maran',   team: ['JJ', 'Jon', 'Farhan', 'ZY', 'Wen Jun'] },
  2: { colour: 'var(--p2)', colourName: 'Red',    pc: 'Encik Ong',     team: ['Sanket', 'Ivan', 'Ikhwan', 'Chris'] },
  3: { colour: 'var(--p3)', colourName: 'Green',  pc: 'Encik Johnny',  team: ['Jirawat', 'Shiven', "Mu'aadz", 'YH', 'Cliff'] },
  4: { colour: 'var(--p4)', colourName: 'Blue',   pc: 'Encik Pandian', team: ['Anees', 'Oscar', 'Sean', 'Adzhan', 'Gerald'] },
};

const $ = id => document.getElementById(id);
const enc = new TextEncoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));


async function lookup(nric) {
  const base = await crypto.subtle.importKey('raw', enc.encode(nric), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(FINDER_DATA.salt), iterations: FINDER_DATA.iter }, base, 384);
  const id = hex(bits.slice(32));
  const blob = FINDER_DATA.records[id];
  if (!blob) return null;
  const raw = b64(blob);
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}

function show(rec) {
  const p = +rec.d4[1], s = +rec.d4[2], bed = rec.d4.slice(3);
  const P = PLATOONS[p];
  $('res').innerHTML = `
    <div class="result">
      <div class="band" style="background:${P.colour}">
        <span class="eyebrow">Apache Coy · ${P.colourName}</span>
        <p class="plt">Platoon ${p}</p>
        <p class="name">REC ${esc(rec.name)}</p>
        <div class="d4" aria-label="4D number ${esc(rec.d4)}"><span>A</span><span>${p}</span><span>${s}</span><span>${esc(bed)}</span></div>
        <div class="d4legend"><span>COY</span><span>PLT ${p}</span><span>SEC ${s}</span><span>BED ${esc(bed)}</span></div>
      </div>
      <dl class="facts">
        <div class="row"><dt>4D number</dt><dd>${esc(rec.d4)}</dd></div>
        <div class="row"><dt>Section</dt><dd>Section ${s}, Bed ${esc(bed)}</dd></div>
        <div class="row"><dt>Platoon Comd</dt><dd>${esc(P.pc)}</dd></div>
        <div class="row"><dt>Instructors</dt><dd>${P.team.map(n => '3SG ' + esc(n)).join(', ')}</dd></div>
      </dl>
      ${rec.wa && /^https:\/\/chat\.whatsapp\.com\/[A-Za-z0-9]+$/.test(rec.wa) ? `<a class="wa" href="${esc(rec.wa)}" target="_blank" rel="noopener">Join the Platoon ${p} WhatsApp group</a>` : `<p class="wa-none">Your platoon WhatsApp group link will be shared by your commanders.</p>`}
      <div class="next"><strong>What to do now</strong>Go to the Platoon ${p} (${P.colourName.toLowerCase()}) holding area and look for ${esc(P.pc)} or any Platoon ${p} instructor. Remember your 4D number: <b>${esc(rec.d4)}</b>.</div>
    </div>
    <button class="again" id="again" type="button" style="margin-top:14px;width:100%">Search another NRIC</button>`;
  $('f').hidden = true; $('res').hidden = false;
  $('again').onclick = () => { $('res').hidden = true; $('f').hidden = false; $('nric').value = ''; $('nric').focus(); };
  window.scrollTo(0, 0);
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const nric = $('nric').value.trim().toUpperCase();
  $('err').hidden = true;
  if (!/^[STFGM]\d{7}[A-Z]$/.test(nric)) {
    $('err').textContent = 'That doesn’t look like an NRIC. It should be 1 letter, 7 numbers and 1 letter, like T1234567A.';
    $('err').hidden = false; return;
  }
  $('go').disabled = true; $('go').textContent = 'Checking…';
  try {
    const rec = await lookup(nric);
    if (rec) show(rec);
    else { $('err').textContent = 'We couldn’t find this NRIC in Apache Coy. Check it and try again, or go to the registration table.'; $('err').hidden = false; }
  } catch (err) {
    $('err').textContent = 'Something went wrong on this phone. Please go to the registration table.'; $('err').hidden = false;
  } finally { $('go').disabled = false; $('go').textContent = 'Find my platoon'; }
});
</script>
